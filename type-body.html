<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shadows</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 32px; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; flex: 1; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box {
    width: 84px; height: 60px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 10px;
  }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); text-align: center; }
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">Elevation</span>
  <div class="grid">
    <div class="item"><div class="box"></div><span class="name">none</span></div>
    <div class="item"><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,0.4);"></div><span class="name">shadow-sm</span></div>
    <div class="item"><div class="box" style="box-shadow:0 4px 16px rgba(0,0,0,0.45);"></div><span class="name">shadow-md</span></div>
    <div class="item"><div class="box" style="box-shadow:0 16px 40px rgba(0,0,0,0.55);"></div><span class="name">shadow-lg</span></div>
    <div class="item"><div class="box" style="box-shadow:0 0 0 1px rgba(214,59,59,0.4),0 8px 32px rgba(214,59,59,0.18);"></div><span class="name">glow-red</span></div>
  </div>
</div>
</body>
</html>
