<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Radii</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px 28px; gap: 16px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; flex: 1; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box {
    width: 72px; height: 72px;
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
  }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg3); }
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">Corner radii</span>
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:0;"></div><span class="name">none</span><span class="px">0</span></div>
    <div class="item"><div class="box" style="border-radius:4px;"></div><span class="name">r-xs</span><span class="px">4</span></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><span class="name">r-sm</span><span class="px">8</span></div>
    <div class="item"><div class="box" style="border-radius:12px;"></div><span class="name">r-md</span><span class="px">12</span></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><span class="name">r-lg</span><span class="px">16</span></div>
    <div class="item"><div class="box" style="border-radius:999px;"></div><span class="name">r-pill</span><span class="px">999</span></div>
  </div>
</div>
</body>
</html>
