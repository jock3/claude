<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8" />
  <title>Track3r — Tracking Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root {
      --pad: 32px;
      --gap: 20px;
      --panel-pad: 24px;
      --summary-pad: 16px 24px;
      --panel-min: 600px;
    }
    [data-density="compact"] {
      --pad: 22px;
      --gap: 14px;
      --panel-pad: 18px;
      --summary-pad: 12px 18px;
      --panel-min: 520px;
    }

    html, body { margin: 0; background: var(--t3-bg-soft); min-height: 100vh; }
    body { font-family: var(--t3-font); color: var(--t3-ink); -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }

    /* ── stage / layout ─────────────────────────────────────────── */
    .t3-stage {
      max-width: 1480px;
      margin: 0 auto;
      padding: var(--pad);
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      min-height: 100vh;
    }

    .t3-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--gap); flex-wrap: wrap;
    }
    .t3-header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .t3-datesel {
      display: flex; align-items: center; gap: 6px;
      background: var(--t3-bg-elevated); border: 0.5px solid var(--t3-line);
      border-radius: 10px; padding: 4px 6px;
    }
    .t3-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex: none;
      background: var(--t3-ink); color: var(--t3-bg);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 13px; letter-spacing: -0.02em;
    }

    /* ── summary strip ──────────────────────────────────────────── */
    .t3-summary {
      background: var(--t3-bg-elevated); border: 0.5px solid var(--t3-line);
      border-radius: 10px; padding: var(--summary-pad);
      display: flex; align-items: center; gap: 26px; flex-wrap: wrap;
    }
    .t3-summary-eyebrow {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      font-weight: 700; color: var(--t3-ink); white-space: nowrap;
    }
    .t3-vsplit { width: 1px; height: 28px; background: var(--t3-line); flex: none; }
    .t3-summary-spacer { flex: 1; min-width: 12px; }
    .t3-stat { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
    .t3-stat-lbl {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      font-weight: 700; color: var(--t3-ink-3);
    }
    .t3-stat-num { font-size: 22px; font-weight: 900; letter-spacing: -0.02em; line-height: 1; color: var(--t3-ink); }
    .t3-stat-unit { color: var(--t3-ink-3); font-size: 12px; font-weight: 500; }
    .t3-stat-delta {
      font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 700; margin-left: 2px;
    }

    /* ── main grid ──────────────────────────────────────────────── */
    .t3-main {
      display: grid; grid-template-columns: 1.32fr 1fr; gap: var(--gap);
      align-items: stretch; flex: 1; min-height: 0;
    }
    .t3-main > section { min-height: var(--panel-min); gap: 16px; }

    .t3-panel-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .t3-panel-title { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -0.02em; color: var(--t3-ink); }
    .t3-panel-sub { color: var(--t3-ink-3); font-size: 12px; }

    /* ── form controls ──────────────────────────────────────────── */
    .t3-input {
      width: 100%; box-sizing: border-box;
      font-family: var(--t3-font); font-size: 14px; color: var(--t3-ink);
      padding: 10px 12px; border: 1px solid var(--t3-line); border-radius: 6px;
      background: var(--t3-bg); outline: none;
      transition: border-color 140ms, box-shadow 140ms;
    }
    .t3-input:focus { border-color: var(--t3-teal); box-shadow: 0 0 0 3px rgba(59,147,136,0.14); }
    select.t3-input {
      appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 30px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23888787' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat; background-position: right 12px center;
    }

    /* ── inline editable number ─────────────────────────────────── */
    .t3-editnum {
      outline: none; border-bottom: 1px dashed transparent; border-radius: 3px;
      padding: 0 2px; margin: 0 -2px; transition: background 120ms, border-color 120ms;
      font-variant-numeric: tabular-nums;
    }
    .t3-editnum:hover { border-bottom-color: var(--t3-ink-4); background: var(--t3-bg-soft); }
    .t3-editnum:focus { border-bottom-color: var(--t3-teal); background: var(--t3-teal-mist); }

    /* ── interaction states ─────────────────────────────────────── */
    .t3-press { transition: transform 140ms cubic-bezier(0.2,0.7,0.2,1); }
    .t3-press:active { transform: scale(0.97); }
    .t3-row { transition: background 120ms; border-radius: 6px; }
    .t3-row:hover { background: var(--t3-bg-soft); }

    .t3-scroll { scrollbar-width: thin; scrollbar-color: var(--t3-line) transparent; }
    .t3-scroll::-webkit-scrollbar { width: 8px; }
    .t3-scroll::-webkit-scrollbar-thumb { background: var(--t3-line); border-radius: 4px; }

    /* ── animations ─────────────────────────────────────────────── */
    @keyframes t3-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t3-sheet { from { opacity: 0; transform: translateY(12px) scale(0.99); } to { opacity: 1; transform: none; } }
    @keyframes t3-toast { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    [data-lucide] svg { width: 100%; height: 100%; display: block; }

    /* ── responsive ─────────────────────────────────────────────── */
    @media (max-width: 1080px) {
      .t3-main { grid-template-columns: 1fr; }
      .t3-main > section { min-height: auto; }
      .t3-scroll { overflow: visible !important; }
    }
    @media (max-width: 720px) {
      :root { --pad: 16px; --gap: 14px; --panel-pad: 16px; --summary-pad: 14px 16px; }
      .t3-header { gap: 12px; }
      .t3-datesel { flex: 1; justify-content: space-between; }
      .t3-summary { gap: 14px 18px; }
      .t3-summary .t3-vsplit { display: none; }
      .t3-summary-spacer { flex-basis: 100%; height: 0; }
      .t3-stat { flex: 1 1 40%; }
    }
    @media (max-width: 480px) {
      .t3-stat-num { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/t3-store.jsx"></script>
  <script type="text/babel" src="app/t3-ui.jsx"></script>
  <script type="text/babel" src="app/t3-food.jsx"></script>
  <script type="text/babel" src="app/t3-training.jsx"></script>
  <script type="text/babel" src="app/t3-history.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app/t3-hub.jsx"></script>
</body>
</html>
