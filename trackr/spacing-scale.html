<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Logo · Black on dark</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 0; }
  .frame {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 320px;
  }
  .pane {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    position: relative;
  }
  .pane.dark { background: var(--color-bg); }
  .pane.light { background: var(--color-text); }
  .pane img { max-width: 70%; max-height: 80%; }
  .label {
    position: absolute;
    bottom: 12px;
    left: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
  }
  .pane.dark .label { color: var(--fg2); }
  .pane.light .label { color: #555; }
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    <div class="pane dark">
      <img src="../assets/logo-white.png" alt="Logo, white on dark" />
      <span class="label">on #0E0E0F</span>
    </div>
    <div class="pane light">
      <img src="../assets/logo-black.png" alt="Logo, black on light" />
      <span class="label">on #F0EFE8</span>
    </div>
  </div>
</div>
</body>
</html>
