<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px 28px; gap: 8px; }
  .scale { display: flex; flex-direction: column; gap: 6px; }
  .row-s { display: flex; align-items: center; gap: 14px; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--fg2); width: 56px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); width: 48px; text-align: right; }
  .bar { height: 14px; background: var(--color-red); border-radius: 2px; }
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">Spacing — 4px base</span>
  <div class="scale">
    <div class="row-s"><span class="token">sp-1</span><span class="px">4px</span><div class="bar" style="width:4px;"></div></div>
    <div class="row-s"><span class="token">sp-2</span><span class="px">8px</span><div class="bar" style="width:8px;"></div></div>
    <div class="row-s"><span class="token">sp-3</span><span class="px">12px</span><div class="bar" style="width:12px;"></div></div>
    <div class="row-s"><span class="token">sp-4</span><span class="px">16px</span><div class="bar" style="width:16px;"></div></div>
    <div class="row-s"><span class="token">sp-5</span><span class="px">24px</span><div class="bar" style="width:24px;"></div></div>
    <div class="row-s"><span class="token">sp-6</span><span class="px">32px</span><div class="bar" style="width:32px;"></div></div>
    <div class="row-s"><span class="token">sp-7</span><span class="px">48px</span><div class="bar" style="width:48px;"></div></div>
    <div class="row-s"><span class="token">sp-8</span><span class="px">64px</span><div class="bar" style="width:64px;"></div></div>
    <div class="row-s"><span class="token">sp-9</span><span class="px">96px</span><div class="bar" style="width:96px;"></div></div>
    <div class="row-s"><span class="token">sp-10</span><span class="px">128px</span><div class="bar" style="width:128px;"></div></div>
  </div>
</div>
</body>
</html>
