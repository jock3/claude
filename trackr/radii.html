<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Inputs</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px 28px; gap: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 12px; font-weight: 600; color: var(--fg2); letter-spacing: 0.04em; }
  .input {
    background: var(--color-surface);
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 14px;
    outline: none;
    transition: border-color 200ms cubic-bezier(0.22,1,0.36,1);
  }
  .input.focus { border-color: var(--color-blue); box-shadow: 0 0 0 3px rgba(46,111,212,0.25); }
  .input.error { border-color: var(--color-red); }
  .helper { font-size: 11px; color: var(--fg3); }
  .helper.error { color: var(--color-red); }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .checkbox-ui {
    width: 16px; height: 16px;
    border: 1px solid var(--color-border-strong);
    border-radius: 4px;
    background: var(--color-surface);
    display: grid; place-items: center;
    color: var(--color-red);
    font-size: 11px;
  }
  .checkbox-ui.on { background: var(--color-red); border-color: var(--color-red); color: var(--color-text); }
</style>
</head>
<body>
<div class="card">
  <span class="eyebrow">Form inputs</span>
  <div class="grid">
    <div class="field">
      <span class="label">Name</span>
      <input class="input" value="Gustav Mattsson" />
      <span class="helper">Default state</span>
    </div>
    <div class="field">
      <span class="label">Email</span>
      <input class="input focus" value="hej@gustav.se" />
      <span class="helper">Focus — blue ring</span>
    </div>
    <div class="field">
      <span class="label">Subject</span>
      <input class="input" placeholder="What's this about?" />
      <span class="helper">Empty / placeholder</span>
    </div>
    <div class="field">
      <span class="label">Phone</span>
      <input class="input error" value="07-not-a-number" />
      <span class="helper error">Doesn't look right.</span>
    </div>
  </div>
  <div class="row" style="gap:24px;">
    <label class="checkbox"><span class="checkbox-ui on">✓</span> Subscribe to occasional notes</label>
    <label class="checkbox"><span class="checkbox-ui"></span> Send me a copy</label>
  </div>
</div>
</body>
</html>
