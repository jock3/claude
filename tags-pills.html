<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Portrait</title>
<link rel="stylesheet" href="_card.css" />
<style>
  .card { padding: 24px 28px; gap: 16px; flex-direction: row; align-items: center; }
  .portrait {
    width: 180px; height: 220px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--color-border);
    flex-shrink: 0;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.05); }
  .meta { display: flex; flex-direction: column; gap: 8px; }
  .meta .name { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .meta .role { font-size: 14px; color: var(--fg2); }
  .meta .quote { font-family: "Patrick Hand", cursive; font-size: 22px; color: var(--color-red); margin-top: 8px; }
  .meta .desc { font-size: 13px; color: var(--fg2); max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="portrait"><img src="../assets/gustav-portrait.jpg" alt="Gustav Mattsson" /></div>
  <div class="meta">
    <span class="eyebrow">Imagery — B&amp;W default</span>
    <span class="name">Gustav Mattsson</span>
    <span class="role">Designer &amp; developer · Stockholm</span>
    <span class="quote">"Made by hand."</span>
    <span class="desc">Black-and-white default, mild grain, color OK if the work is the subject. Never warm filters, never stock.</span>
  </div>
</div>
</body>
</html>
