<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Palette explorer</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); }
  body { transition: background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 32px 96px; }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 40px; }
  .topbar h1 { font-size: 40px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .topbar .desc { color: var(--fg2); font-size: 15px; max-width: 460px; line-height: 1.5; margin: 0; }
  .badges { display: flex; gap: 8px; flex-shrink: 0; }
  .badge {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--color-border);
    color: var(--fg2); background: var(--color-surface);
  }
  .badge.dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: var(--color-accent); margin-right: 7px; vertical-align: baseline; }

  .section { margin-top: 40px; }
  .section > .eyebrow { display: block; margin-bottom: 16px; }

  /* swatch ramps */
  .ramp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .chip { border-radius: 10px; border: 1px solid var(--color-border); overflow: hidden; }
  .chip .fill { height: 64px; }
  .chip .info { padding: 8px 10px; background: var(--color-surface); }
  .chip .nm { font-size: 12px; font-weight: 600; }
  .chip .hx { font-family: var(--font-mono); font-size: 10px; color: var(--fg2); }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  .panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 20px; }

  /* text specimens */
  .text-stack { display: flex; flex-direction: column; gap: 10px; }
  .text-row { display: flex; align-items: baseline; gap: 14px; }
  .text-row .k { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); width: 70px; flex-shrink: 0; }

  /* accent cards */
  .accent-card { display: flex; gap: 14px; align-items: center; }
  .accent-block { width: 72px; height: 72px; border-radius: 10px; flex-shrink: 0; }
  .accent-card .nm { font-size: 16px; font-weight: 700; }
  .accent-card .hx { font-family: var(--font-mono); font-size: 12px; color: var(--fg2); }
  .accent-card .use { font-size: 12px; color: var(--fg2); margin-top: 4px; max-width: 200px; line-height: 1.4; }

  /* buttons */
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; line-height: 1; transition: all var(--dur-base) var(--ease-out); }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--color-accent); color: var(--color-text-inverse); }
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-secondary { background: var(--color-surface-2); color: var(--color-text); border-color: var(--color-border); }
  .btn-secondary:hover { background: var(--color-surface-3); }
  .btn-ghost { background: transparent; color: var(--color-text); border-color: var(--color-border); }
  .btn-link { background: transparent; color: var(--color-link); padding: 6px 0; }

  .input { width: 100%; box-sizing: border-box; background: var(--color-surface-2); color: var(--color-text); border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; font-family: var(--font-body); font-size: 14px; outline: none; }
  .input.focus { border-color: var(--color-link); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-link) 25%, transparent); }

  .pill { font-size: 12px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--color-border); background: transparent; color: var(--fg2); }
  .pill.active { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-text-inverse); }
  .pill.solid { background: var(--color-surface-2); color: var(--fg1); }

  .work-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-md); }
  .work-card .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); letter-spacing: 0.06em; }
  .work-card h4 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .work-card p { margin: 0; font-size: 13px; color: var(--fg2); line-height: 1.5; }
  .work-card .read { color: var(--color-link); font-size: 13px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .hand { font-family: var(--font-hand); color: var(--color-accent); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

const PALETTES = {
  ember: {
    label: "Ember",
    desc: "Coral on a light, neutral grey. Energetic and accent-forward — the brush does the talking.",
    dark:  { bg:"#242425", surface:"#2E2E30", "surface-2":"#38383A", "surface-3":"#424244", border:"#4E4E50", "border-strong":"#636365", text:"#F2F1EF", muted:"#B3B1AD", faint:"#828079", accent:"#FF582D", "accent-hover":"#FF6F47", link:"#3AA59C" },
    light: { bg:"#F4F4F3", surface:"#FFFFFF", "surface-2":"#ECECEB", "surface-3":"#E2E2E0", border:"#DEDEDC", "border-strong":"#C4C4C1", text:"#1C1B1A", muted:"#66645F", faint:"#94928D", accent:"#E8431B", "accent-hover":"#FF582D", link:"#1E8077" },
    accentName: "Coral · 17-1363 TSX",
    linkName: "Teal",
  },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark"
}/*EDITMODE-END*/;

function Chip({ name, token, hex }) {
  return (
    <div className="chip">
      <div className="fill" style={{ background: `var(--color-${token})` }}></div>
      <div className="info">
        <div className="nm">{name}</div>
        <div className="hx">{hex}</div>
      </div>
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const p = PALETTES.ember;
  const scale = p[t.theme];

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
  }, [t.theme]);

  const surfaceChips = [
    ["bg", "bg", scale.bg],
    ["surface", "surface", scale.surface],
    ["surface-2", "surface-2", scale["surface-2"]],
    ["surface-3", "surface-3", scale["surface-3"]],
    ["border", "border", scale.border],
    ["border ++", "border-strong", scale["border-strong"]],
  ];
  const textChips = [
    ["text · fg1", "text", scale.text],
    ["muted · fg2", "text-muted", scale.muted],
    ["faint · fg3", "text-faint", scale.faint],
  ];

  return (
    <div className="wrap">
      <div className="topbar">
        <div>
          <span className="eyebrow">Theme preview · light &amp; dark</span>
          <h1 style={{ marginTop: 8 }}>{p.label}</h1>
          <p className="desc">{p.desc}</p>
        </div>
        <div className="badges">
          <span className="badge dot">{p.label}</span>
          <span className="badge">{t.theme === "dark" ? "Dark" : "Light"}</span>
        </div>
      </div>

      <div className="section">
        <span className="eyebrow">Surfaces &amp; structure</span>
        <div className="ramp">
          {surfaceChips.map(([n, tok, hx]) => <Chip key={tok} name={n} token={tok} hex={hx} />)}
        </div>
      </div>

      <div className="section two">
        <div>
          <span className="eyebrow">Foreground · text</span>
          <div className="ramp" style={{ gridTemplateColumns: "1fr 1fr 1fr", marginTop: 16 }}>
            {textChips.map(([n, tok, hx]) => <Chip key={tok} name={n} token={tok} hex={hx} />)}
          </div>
        </div>
        <div>
          <span className="eyebrow">Accents</span>
          <div className="two" style={{ marginTop: 16, gridTemplateColumns: "1fr 1fr", gap: 12 }}>
            <div className="panel accent-card">
              <div className="accent-block" style={{ background: "var(--color-accent)" }}></div>
              <div>
                <div className="nm" style={{ color: "var(--color-accent)" }}>Accent</div>
                <div className="hx">{scale.accent}</div>
                <div className="use">{p.accentName}. CTAs, brush, active state.</div>
              </div>
            </div>
            <div className="panel accent-card">
              <div className="accent-block" style={{ background: "var(--color-link)" }}></div>
              <div>
                <div className="nm" style={{ color: "var(--color-link)" }}>Link</div>
                <div className="hx">{scale.link}</div>
                <div className="use">{p.linkName}. Links &amp; focus only.</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="section">
        <span className="eyebrow">Type</span>
        <div className="panel">
          <div className="text-stack">
            <div className="text-row"><span className="k">h1 / 48</span><span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 40, letterSpacing: "-0.02em", lineHeight: 1 }}>Hej, jag heter Gustav.</span></div>
            <div className="text-row"><span className="k">h3 / 24</span><span style={{ fontFamily: "var(--font-display)", fontWeight: 600, fontSize: 22 }}>Selected work, 2024 → now</span></div>
            <div className="text-row"><span className="k">body / 16</span><span style={{ fontSize: 15, color: "var(--fg1)" }}>I design and build interfaces — mostly for the web.</span></div>
            <div className="text-row"><span className="k">muted / 14</span><span style={{ fontSize: 14, color: "var(--fg2)" }}>Stockholm, Sweden — currently freelance</span></div>
            <div className="text-row"><span className="k">hand</span><span className="hand" style={{ fontSize: 24 }}>a note in the margin →</span></div>
            <div className="text-row"><span className="k">mono</span><span style={{ fontFamily: "var(--font-mono)", fontSize: 14, color: "var(--fg2)" }}>0100 0111 · v2.4.0</span></div>
          </div>
        </div>
      </div>

      <div className="section">
        <span className="eyebrow">Components</span>
        <div className="three" style={{ alignItems: "start" }}>
          <div className="panel">
            <div className="row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10 }}>
              <button className="btn btn-primary">Get in touch <span>→</span></button>
              <button className="btn btn-secondary">View work</button>
              <button className="btn btn-ghost">Cancel</button>
              <button className="btn btn-link" style={{ alignSelf: "flex-start" }}>Read the case study →</button>
            </div>
          </div>
          <div className="panel">
            <div className="row" style={{ flexDirection: "column", alignItems: "stretch", gap: 10 }}>
              <input className="input" defaultValue="Gustav Mattsson" />
              <input className="input focus" defaultValue="hej@gustav.se" />
              <div className="row" style={{ gap: 6 }}>
                <span className="pill active">All</span>
                <span className="pill">Brand</span>
                <span className="pill solid">2026</span>
              </div>
            </div>
          </div>
          <div className="work-card">
            <span className="meta">2025 · Product</span>
            <h4>Atlas — checkout v3</h4>
            <p>Rebuilt the checkout from scratch. Conversion up 11%, tickets down by half.</p>
            <span className="read">Read more →</span>
          </div>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Mode" />
        <TweakRadio
          label="Theme"
          value={t.theme}
          options={["dark", "light"]}
          onChange={(v) => setTweak("theme", v)}
        />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
